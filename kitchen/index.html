<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KNK Kitchen</title>
<meta name="theme-color" content="#57573c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KNK Kitchen">
<script src="../config.js"></script>
<script src="../common.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe8de; --surface:#fbf8f3; --ink:#3a2418; --muted:#7a685a; --line:#ddd2c4;
  --olive:#57573c; --olive-ink:#f3ead9; --gold:#b48650; --gold-2:#e4bf82; --tint:#e6ddcf;
  --ok:#4f6b3a; --error:#a33b2c;
}
/* Theme: Auto follows the phone; the Theme button can force Light or Dark */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#1d1c16; --surface:#27261e; --ink:#efe6d9; --muted:#a99b8a; --line:#3a382d;
         --olive:#3f402b; --olive-ink:#efe6d9; --gold:#c99d62; --gold-2:#ecc98f; --tint:#2f2e24;
         --ok:#5f7f45; --error:#b5503f; }
}
:root[data-theme="dark"]{ --paper:#1d1c16; --surface:#27261e; --ink:#efe6d9; --muted:#a99b8a; --line:#3a382d;
         --olive:#3f402b; --olive-ink:#efe6d9; --gold:#c99d62; --gold-2:#ecc98f; --tint:#2f2e24;
         --ok:#5f7f45; --error:#b5503f; }
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{background:var(--olive);color:var(--olive-ink)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.logo{line-height:.85;margin:0;font-weight:400;display:flex;align-items:flex-end;gap:14px}
.logo small{display:block;font-family:'Figtree',sans-serif;font-weight:600;letter-spacing:.34em;font-size:12px;color:var(--gold-2);margin:0 0 2px 3px}
.logo .kafe{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:40px;
  background:linear-gradient(100deg,#b0844f,#e8c48a);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .pt{font-family:'Marcellus',serif;font-size:22px;padding-bottom:4px;color:var(--olive-ink)}
.sync{font-size:13px;opacity:.85;text-align:right;padding-bottom:4px}
.sync .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9fd07a;margin-right:6px}
.sync.off .dot{background:#e38b78}

main{max-width:1240px;margin:0 auto;padding:20px}

.login{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px}
.login h2{font-family:'Marcellus',serif;font-weight:400;font-size:26px;margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 16px;font-size:15px}
.login input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;font-size:22px;letter-spacing:.3em;text-align:center;margin-bottom:12px}

.btn{border:0;background:var(--olive);color:var(--olive-ink);padding:13px 18px;border-radius:12px;font-weight:700}
.btn.go{background:var(--gold);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.light{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.full{width:100%}

.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.col h2{font-family:'Marcellus',serif;font-weight:400;font-size:22px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.col h2 span{font-family:'Figtree',sans-serif;font-size:14px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.s-Placed{border:2px solid var(--gold)}
.card.s-Ready{border-left:5px solid var(--ok)}
.c-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.c-name{font-weight:700;font-size:18px}
.c-age{font-size:14px;color:var(--muted);white-space:nowrap}
.card.late .c-age{color:var(--error);font-weight:700}
.c-time{font-size:13px;color:var(--muted)}
.c-items{list-style:none;margin:10px 0;padding:0;font-size:17px}
.c-items li{padding:3px 0;border-bottom:1px dashed var(--line)}
.c-items li:last-child{border-bottom:0}
.c-items b{display:inline-block;min-width:34px;font-size:18px;color:var(--gold)}
.c-note{background:var(--tint);border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:10px}
.c-status{margin-bottom:10px}
.c-actions{display:flex;gap:8px;flex-wrap:wrap}
.c-actions .btn{flex:1 1 auto}
.empty{color:var(--muted);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:12px;text-align:center}

.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.st-Received,.st-Preparing{background:var(--olive);color:var(--olive-ink)}
.st-Delivered{background:var(--tint);color:var(--muted)}
.st-Cancelled{background:var(--error);color:#fff}

.done{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.done summary{cursor:pointer;padding:12px 0;font-weight:700}
.drow{display:grid;grid-template-columns:90px 160px 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.drow .log{grid-column:2/-1;color:var(--muted);font-size:12px;margin-top:-6px}
@media (max-width:640px){.drow{grid-template-columns:70px 1fr auto}.drow .it{grid-column:2/-1}}

.err{color:var(--error);font-size:14px;margin-top:10px}
.hidden{display:none!important}

@media (prefers-reduced-motion:no-preference){
  :root{--ease:cubic-bezier(.2,.8,.2,1)}
  .btn{transition:opacity .2s var(--ease),transform .14s var(--ease),background-color .2s var(--ease)}
  .btn:active:not(:disabled){transform:scale(.95)}
  .card{transition:opacity .2s var(--ease),transform .2s var(--ease)}
  .card.enter{animation:cardIn .38s var(--ease) backwards}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98)}}
  .card.leaving{opacity:.4;transform:scale(.97)}
  .card.fresh{animation:cardIn .38s var(--ease) backwards,pulse 1.1s ease-in-out .4s 4}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(180,134,80,.35)}}
  .top{transition:background-color .3s ease}
  .top.flash{animation:flash 1s ease 3}
  @keyframes flash{50%{background:#8a7444}}
  .login,#board:not(.hidden){animation:rise .3s var(--ease)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  .sync .dot{animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.35}}
  .sync.off .dot{animation:none}
}

.top{padding-top:env(safe-area-inset-top,0px)}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.install{border:1px solid var(--gold-2);background:transparent;color:var(--gold-2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}

/* use our own dark design; stop the phone from force-darkening or side-scrolling the page */
:root:not([data-theme]){color-scheme:light dark}
html,body{overflow-x:hidden;max-width:100%}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 class="logo"><span><small>KNK</small><span class="kafe">Kafé</span></span><span class="pt" id="stLabel">Kitchen</span></h1>
    <div class="hdr-r"><div><button class="install" id="testSound">Test sound</button> <button class="install hidden" id="switchBtn">Switch</button> <button class="install" id="themeBtn" aria-label="Change theme">◐ Auto</button> <button class="install hidden" id="installBtn">Install app</button></div>
    <div class="sync hidden" id="sync"><span class="dot"></span><span id="syncTxt">Connecting…</span></div></div>
  </div>
</header>

<main>
  <section class="login" id="login">
    <h2>KNK Kitchen</h2>
    <p>Enter your Kafé counter PIN or Pantry PIN. The app opens the right screen for your station. Keep it open with the volume up.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="Pantry PIN">
    <button class="btn go full" id="startBtn">Start receiving orders</button>
    <div class="err hidden" id="pinErr"></div>
  </section>

  <section id="board" class="hidden">
    <div class="cols">
      <div class="col"><h2>New <span id="nNew"></span></h2><div id="colNew"></div></div>
      <div class="col"><h2>In progress <span id="nProg"></span></h2><div id="colProg"></div></div>
      <div class="col"><h2>Ready to serve <span id="nReady"></span></h2><div id="colReady"></div></div>
    </div>
    <details class="done">
      <summary>Completed today (<span id="nDone">0</span>)</summary>
      <div id="colDone"></div>
    </details>
  </section>
</main>

<script>
let STATION = '', STATION_LABEL = 'Kitchen';
const P = { pin: '', rev: '', orders: [], known: null, offset: 0, timer: null, nag: null, busy: false, where: {} };
const POLL_MS = 6000, NAG_MS = 20000, LATE_MIN = 10;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ---------- Alerts ---------- */
function alertNewOrder(){
  KNKSound.play('order');
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch(e){}
  const top = document.querySelector('.top');
  top.classList.remove('flash'); void top.offsetWidth; top.classList.add('flash');
}
$('#testSound').onclick = () => KNKSound.play('order');

/* ---------- Login ---------- */
window.addEventListener('load', () => { $('#pin').value = store.get('knk_kitchen_pin'); });
$('#pin').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
$('#startBtn').onclick = start;

function start(){
  KNKSound.unlock();
  const pin = $('#pin').value.trim();
  $('#pinErr').classList.add('hidden');
  if (!pin) { showPinErr('Enter the PIN.'); return; }
  $('#startBtn').disabled = true; $('#startBtn').textContent = 'Checking…';
  api('stationLoginByPin', pin)
    .then(r => {
      STATION = r.station; STATION_LABEL = r.label;
      $('#stLabel').textContent = r.label === 'Pantry' ? 'Pantry' : 'Kafé Counter';
      $('#switchBtn').classList.remove('hidden');
      P.pin = pin; store.set('knk_kitchen_pin', pin);
      $('#login').classList.add('hidden'); $('#board').classList.remove('hidden'); $('#sync').classList.remove('hidden');
      keepAwake(); poll(true);
      P.nag = setInterval(() => { if (P.orders.some(o => o.status === 'Placed')) alertNewOrder(); }, NAG_MS);
      setInterval(() => { if (!P.busy) render(); }, 30000); // refresh "x min ago"
    })
    .catch(e => {
      $('#startBtn').disabled = false; $('#startBtn').textContent = 'Start receiving orders';
      showPinErr(e.message);
    });
}
function showPinErr(m){ $('#pinErr').textContent = m; $('#pinErr').classList.remove('hidden'); }

async function keepAwake(){
  try { if ('wakeLock' in navigator) { await navigator.wakeLock.request('screen'); } } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && P.pin) { keepAwake(); poll(true); } });

/* ---------- Polling ---------- */
function poll(force){
  clearTimeout(P.timer);
  api('getStationData', STATION, P.pin, force ? '' : P.rev)
    .then(res => {
      P.offset = res.now - Date.now();
      setSync(true);
      if (!res.same) { P.rev = res.rev; accept(res.orders); }
      P.timer = setTimeout(() => poll(false), POLL_MS);
    })
    .catch(e => {
      if (/PIN/i.test(e.message)) { logout(e.message); return; }
      setSync(false);
      P.timer = setTimeout(() => poll(false), POLL_MS * 2);
    });
}

function setSync(ok){
  $('#sync').classList.toggle('off', !ok);
  const now = new Date();
  $('#syncTxt').textContent = ok
    ? 'Live, updated ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
    : 'Connection lost, retrying';
}

function logout(msg){
  clearTimeout(P.timer); clearInterval(P.nag);
  store.del('knk_kitchen_pin'); P.pin = ''; P.rev = ''; P.orders = []; P.known = null; P.where = {};
  $('#stLabel').textContent = 'Kitchen'; $('#switchBtn').classList.add('hidden');
  $('#board').classList.add('hidden'); $('#sync').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#startBtn').disabled = false; $('#startBtn').textContent = 'Start receiving orders';
  if (msg) showPinErr(msg + ' Enter the current PIN.'); else { $('#pinErr').classList.add('hidden'); $('#pin').value = ''; }
}
$('#switchBtn').onclick = () => { if (confirm('Switch station? You will need to enter a PIN again.')) logout(''); };

function accept(orders){
  const fresh = [];
  if (P.known) orders.forEach(o => { if (o.status === 'Placed' && !P.known[o.id]) fresh.push(o.id); });
  P.known = {}; orders.forEach(o => P.known[o.id] = true);
  P.orders = orders;
  render(fresh);
  if (fresh.length) alertNewOrder();
}

/* ---------- Render ---------- */
const NEXT = {
  Placed:    [['Received', 'Accept order', 'go']],
  Received:  [['Preparing', 'Start preparing', ''], ['Ready', 'Mark ready', 'ok']],
  Preparing: [['Ready', 'Mark ready', 'ok']],
  Ready:     [['Delivered', 'Mark delivered', '']]
};

function mins(o){ return Math.max(0, Math.floor((Date.now() + P.offset - o.t) / 60000)); }
function age(o){ const m = mins(o); return m < 1 ? 'Just now' : m < 60 ? m + ' min ago' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min ago'; }

function card(o, fresh, enter, n){
  const late = o.status !== 'Ready' && mins(o) >= LATE_MIN;
  const actions = (NEXT[o.status] || []).map(a =>
    '<button class="btn ' + a[2] + '" data-id="' + esc(o.id) + '" data-s="' + a[0] + '">' + a[1] + '</button>').join('') +
    (o.status !== 'Ready' ? '<button class="btn light" data-id="' + esc(o.id) + '" data-s="Cancelled">Cancel</button>' : '');
  return '<article class="card s-' + esc(o.status) + (late ? ' late' : '') + (fresh ? ' fresh' : enter ? ' enter' : '') +
    '" style="animation-delay:' + (enter ? Math.min(n, 6) * 45 : 0) + 'ms">' +
    '<div class="c-top"><span class="c-name">' + esc(o.forWho || o.name) + '</span><span class="c-age">' + age(o) + '</span></div>' +
    '<div class="c-time">' + (o.forWho ? 'Client, ordered by ' + esc(o.name) + ' at ' : 'Ordered at ') + esc(o.time) + (o.day !== todayKey() ? ', ' + esc(o.date) : '') + '</div>' +
    '<ul class="c-items">' + o.items.map(i => '<li><b>' + i.qty + '×</b>' + esc(i.item) + '</li>').join('') + '</ul>' +
    (o.note ? '<div class="c-note">' + esc(o.note) + '</div>' : '') +
    (o.status === 'Received' || o.status === 'Preparing' ? '<div class="c-status"><span class="st st-' + o.status + '">' + o.status + '</span></div>' : '') +
    '<div class="c-actions">' + actions + '</div></article>';
}

function todayKey(){
  const d = new Date(Date.now() + P.offset);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function render(fresh){
  fresh = fresh || [];
  const by = s => P.orders.filter(o => s.indexOf(o.status) > -1);
  const where = {};
  const fill = (el, list, emptyText) => {
    $(el).innerHTML = list.length ? list.map((o, n) => {
      where[o.id] = el;
      return card(o, fresh.indexOf(o.id) > -1, P.where[o.id] !== el, n);
    }).join('') : '<div class="empty">' + emptyText + '</div>';
  };
  const nw = by(['Placed']), pr = by(['Received', 'Preparing']), rd = by(['Ready']);
  fill('#colNew', nw, 'No new orders');
  fill('#colProg', pr, 'Nothing being prepared');
  fill('#colReady', rd, 'Nothing waiting to be served');
  $('#nNew').textContent = nw.length || ''; $('#nProg').textContent = pr.length || ''; $('#nReady').textContent = rd.length || '';

  P.where = where;
  const done = by(['Delivered', 'Cancelled']).sort((a, b) => b.t - a.t);
  $('#nDone').textContent = done.length;
  $('#colDone').innerHTML = done.map(o =>
    '<div class="drow"><span>' + esc(o.time) + '</span><b>' + esc(o.forWho ? o.forWho + ' (by ' + o.name + ')' : o.name) + '</b>' +
    '<span class="it">' + esc(o.items.map(i => i.item + ' × ' + i.qty).join(', ')) + '</span>' +
    '<span class="st st-' + esc(o.status) + '">' + esc(o.status) + '</span>' +
    '<span class="log">' + esc(o.log) + '</span></div>').join('');

  document.title = nw.length ? '(' + nw.length + ') New order' + (nw.length > 1 ? 's' : '') + ', ' + STATION_LABEL : 'KNK Kitchen';
}

/* ---------- Status buttons ---------- */
$('#board').addEventListener('click', e => {
  const b = e.target.closest('button[data-s]');
  if (!b) return;
  const id = b.dataset.id, s = b.dataset.s;
  const o = P.orders.find(x => x.id === id);
  if (s === 'Cancelled' && !confirm('Cancel ' + (o ? o.name + '’s' : 'this') + ' order? They will be told it was cancelled.')) return;
  b.disabled = true; b.textContent = 'Saving…'; P.busy = true;
  const cardEl = b.closest('.card'); if (cardEl) cardEl.classList.add('leaving');
  api('updateStatus', STATION, P.pin, id, s)
    .then(res => { P.busy = false; P.rev = res.rev; P.offset = res.now - Date.now(); KNKSound.play('update'); accept(res.orders); })
    .catch(err => { P.busy = false; if (cardEl) cardEl.classList.remove('leaving'); alert(err.message); poll(true); });
});
</script>
</body>
</html>
