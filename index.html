<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNK Kafé</title>
<meta name="theme-color" content="#57573c">
<link rel="icon" href="staff/icon-192.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#57573c;color:#f3ead9;font-family:system-ui,sans-serif;text-align:center;padding:24px}
img{width:96px;height:96px;border-radius:22px}
h1{font-family:Georgia,serif;font-style:italic;font-weight:600;font-size:40px;margin:14px 0 6px;color:#e4bf82}
p{opacity:.85;margin:0 0 26px}
a{display:block;margin:0 auto 12px;max-width:300px;padding:15px;border-radius:12px;background:#e4bf82;color:#3a2418;font-weight:700;text-decoration:none}
a.alt{background:transparent;border:1px solid #e4bf82;color:#e4bf82}

/* use our own dark design; stop the phone from force-darkening or side-scrolling the page */
:root{color-scheme:light dark}
html,body{overflow-x:hidden;max-width:100%}
</style>
</head>
<body>
<main>
  <img src="staff/icon-192.png" alt="">
  <h1>KNK Kafé</h1>
  <p>Choose your app</p>
  <a href="staff/">Order food (staff)</a>
  <a class="alt" href="kitchen/">Kitchen (Kafé counter &amp; Pantry)</a>
</main>
</body>
</html>
